name: Unity tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Unity ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PlayMode currently has no lifecycle scenarios; do not add fake tests.
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v4
        with:
          path: EcaSystemsPackage
      - name: Run package tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: EcaSystemsPackage
          unityVersion: 6000.5.6f1
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} results
          artifactsPath: artifacts/${{ matrix.testMode }}
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-results
          path: ${{ steps.tests.outputs.artifactsPath || format('artifacts/{0}', matrix.testMode) }}
          if-no-files-found: warn
